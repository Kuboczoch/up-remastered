services:
  up:
    build:
      context: .
    container_name: up-remastered
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: file:/data/app.db
      MAX_UPLOAD_SIZE: "1073741824"
      DEFAULT_EXPIRATION_HOURS: "24"
      UP_PUBLIC_ORIGIN: http://localhost:3000
    volumes:
      - ./data:/data
