name: CI

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checks:
    name: Check pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check pull request title
        uses: thehanimo/pr-title-checker@v1.4.3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: false
          configuration_path: .github/pr-title-checker.config.json

  install-node-modules:
    name: Install and cache dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: false

  eslint:
    name: ESLint
    needs: [install-node-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: true

      - name: Run ESLint
        run: pnpm run lint

  typescript:
    name: TypeScript
    needs: [install-node-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: true

      - name: Run TypeScript
        run: pnpm run typecheck

  jest:
    name: Jest unit tests
    needs: [install-node-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: true

      - name: Run Jest unit tests
        run: pnpm run test:unit:ci

  build:
    name: Next.js build
    needs: [install-node-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: true

      - name: Build Next.js
        run: pnpm run build

      - name: Archive Next.js build
        run: tar -czf next-build.tar.gz .next

      - name: Upload Next.js build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: next-build.tar.gz
          retention-days: 1

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Build production Docker image
        run: docker build --pull --tag up-remastered:ci .

  playwright:
    name: Playwright E2E
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install and cache node_modules
        uses: ./.github/actions/workflow-install-node_modules
        with:
          fail-on-cache-miss: true

      - name: Download Next.js build
        uses: actions/download-artifact@v7
        with:
          name: next-build

      - name: Extract Next.js build
        run: tar -xzf next-build.tar.gz

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p 'require(\"./node_modules/@playwright/test/package.json\").version')" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright E2E
        id: playwright-tests
        continue-on-error: true
        run: pnpm run test:e2e:ci

      - name: Create pull request report
        if: always()
        run: node scripts/ci/create-e2e-report.mjs playwright-report/results.json pr-e2e-report.md

      - name: Upload pull request report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-e2e-report
          path: pr-e2e-report.md
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Preserve Playwright result
        if: always() && steps.playwright-tests.outcome != 'success'
        run: exit 1
