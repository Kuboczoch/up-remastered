name: PR E2E report comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Update Playwright and Lighthouse comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    concurrency:
      group: pr-e2e-comment-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    timeout-minutes: 5

    steps:
      - name: Download report
        uses: actions/download-artifact@v7
        with:
          name: pr-e2e-report
          path: report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          body = Path("report/pr-e2e-report.md").read_text()
          Path("comment.json").write_text(json.dumps({"body": body}))
          PY

          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq \
            'map(select(.user.login == "github-actions[bot]" and (.body | contains("<!-- up-remastered-e2e-report -->"))))[0].id // empty')

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input comment.json
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input comment.json
          fi
