name: Install and cache node_modules
description: Checkout repository, setup Node.js, restore pnpm-backed node_modules cache, and install dependencies on cache miss.

inputs:
  fail-on-cache-miss:
    description: Whether the action should fail when the dependency cache is missing.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        check-latest: true

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Restore node_modules cache
      id: cache
      uses: actions/cache@v5
      with:
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        path: |
          ~/.local/share/pnpm/store
          **/node_modules
        key: ${{ runner.os }}-pnpm-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
